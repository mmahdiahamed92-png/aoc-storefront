<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holiday Destinations | OWT Travel</title>
<meta name="description" content="Where will you go? Maldives, Dubai, Thailand, Bali, Japan and more — custom holiday packages from the UK, free quotes.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:#05090f;color:#fff;font:16px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;filter:blur(14px) brightness(.7);transform:scale(1.08);transition:opacity 1.3s ease,filter 1.3s ease,transform 1.3s ease;will-change:opacity,transform,filter}
.slide.on{opacity:1;filter:blur(0) brightness(1);transform:scale(1);animation:ken 9s ease-out forwards}
@keyframes ken{from{transform:scale(1)}to{transform:scale(1.12)}}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,9,15,.35),rgba(5,9,15,.05) 38%,rgba(5,9,15,.9));z-index:2}
.top{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:20px 24px}
.brand{font-family:Fraunces,serif;font-weight:800;font-size:1.2rem;letter-spacing:.5px}
.brand span{color:#f5a623}
.count{font-size:.8rem;opacity:.8;font-variant-numeric:tabular-nums}
.cap{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:0 24px 15vh;text-align:center}
.ey{font-size:.78rem;letter-spacing:5px;text-transform:uppercase;opacity:.9;margin-bottom:10px}
.cap h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(3rem,11vw,7rem);line-height:.95;text-shadow:0 6px 40px rgba(0,0,0,.5)}
.cap p{font-size:clamp(1.05rem,2.6vw,1.5rem);margin:12px auto 24px;max-width:640px;opacity:.96;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.cap.swap h1,.cap.swap p,.cap.swap .ey,.cap.swap .go{opacity:0;transform:translateY(14px)}
.cap h1,.cap p,.cap .ey,.cap .go{transition:opacity .6s ease,transform .6s ease}
.go{display:inline-block;background:#f5a623;color:#3a2500;text-decoration:none;font-weight:800;padding:15px 34px;border-radius:100px;box-shadow:0 10px 40px rgba(245,166,35,.5)}
.prog{position:absolute;top:0;left:0;height:3px;background:#f5a623;width:0;z-index:6;box-shadow:0 0 12px rgba(245,166,35,.8)}
.thumbs{position:absolute;left:0;right:0;bottom:18px;z-index:5;display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:0 0 auto;width:62px;height:42px;border-radius:9px;background-size:cover;background-position:center;cursor:pointer;opacity:.5;border:2px solid transparent;transition:opacity .25s,border-color .25s,transform .25s}
.thumb.on{opacity:1;border-color:#f5a623;transform:translateY(-3px)}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;width:46px;height:46px;border-radius:50%;font-size:1.4rem;cursor:pointer;backdrop-filter:blur(6px)}
.nav:hover{background:rgba(255,255,255,.25)}.nav.prev{left:16px}.nav.next{right:16px}
@media(max-width:620px){.nav{display:none}.cap{padding-bottom:20vh}}
@media(prefers-reduced-motion:reduce){.slide,.slide.on{animation:none;filter:none}}
</style></head>
<body>
<div class="stage" id="stage"></div>
<div class="veil"></div>
<div class="prog" id="prog"></div>
<div class="top"><div class="brand">OWT <span>Travel</span></div><div class="count" id="count"></div></div>
<button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button>
<div class="cap" id="cap"><div class="ey">Where will you go?</div><h1 id="dn"></h1><p id="dt"></p><a class="go" id="dl" href="#">Explore →</a></div>
<div class="thumbs" id="thumbs"></div>
<script>
const S=[{"name":"Maldives","tag":"Overwater villas & the clearest seas on earth","slug":"maldives.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-maldives-hero.jpg"},{"name":"Thailand","tag":"Islands, temples & the warmest welcome","slug":"thailand.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-thailand-hero.jpg"},{"name":"Dubai","tag":"Sunshine, skyscrapers & five-star luxury","slug":"dubai.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-dubai-hero.jpg"},{"name":"Bali","tag":"The Island of the Gods","slug":"bali.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-bali-hero.jpg"},{"name":"Disneyland Paris","tag":"The magic, for the whole family","slug":"disneyland-paris.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-disneyland-paris-hero.jpg"},{"name":"Sri Lanka","tag":"Beaches, tea country & ancient wonders","slug":"sri-lanka.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-sri-lanka-hero.jpg"},{"name":"Japan","tag":"Where tradition meets the future","slug":"japan.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-japan-hero.jpg"},{"name":"Iceland","tag":"Fire, ice & the Northern Lights","slug":"iceland.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-iceland-hero.jpg"},{"name":"Poland","tag":"Beautiful cities, incredible value","slug":"poland.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-poland-hero.jpg"},{"name":"Philippines","tag":"7,000 islands of paradise","slug":"philippines.html","img":"https://fnnecltfowhcocitarln.supabase.co/storage/v1/object/public/aoc-deliverables/img/dest-philippines-hero.jpg"}];
const stage=document.getElementById("stage"),thumbs=document.getElementById("thumbs"),cap=document.getElementById("cap");
S.forEach((s,i)=>{const d=document.createElement("div");d.className="slide";d.style.backgroundImage="url('"+s.img+"')";stage.appendChild(d);
  const t=document.createElement("div");t.className="thumb";t.style.backgroundImage="url('"+s.img+"')";t.onclick=()=>go(i);thumbs.appendChild(t);});
const slides=[...stage.children],ths=[...thumbs.children];
let i=-1,timer,DUR=6000;
function render(n){
  cap.classList.add("swap");
  setTimeout(()=>{
    document.getElementById("dn").textContent=S[n].name;
    document.getElementById("dt").textContent=S[n].tag;
    document.getElementById("dl").href=S[n].slug;
    cap.classList.remove("swap");
  },300);
  slides.forEach((el,k)=>el.classList.toggle("on",k===n));
  ths.forEach((el,k)=>el.classList.toggle("on",k===n));
  document.getElementById("count").textContent=(n+1)+" / "+S.length;
  const p=document.getElementById("prog");p.style.transition="none";p.style.width="0";
  requestAnimationFrame(()=>{p.style.transition="width "+DUR+"ms linear";p.style.width="100%";});
}
function go(n){i=(n+S.length)%S.length;render(i);clearInterval(timer);timer=setInterval(()=>go(i+1),DUR);}
document.getElementById("next").onclick=()=>go(i+1);
document.getElementById("prev").onclick=()=>go(i-1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);if(e.key==="ArrowLeft")go(i-1);});
// preload then start
let loaded=0;S.forEach(s=>{const im=new Image();im.onload=im.onerror=()=>{if(++loaded===1)go(0);};im.src=s.img;});
setTimeout(()=>{if(i<0)go(0);},1200);
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Holiday Quote — OWT Travel</title>
<style>
:root{--ink:#12233a;--dim:#5b6f86;--line:#e2e8f0;--brand:#0e7c86;--brand2:#f5a623;--bg:#f6f9fb}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{background:linear-gradient(135deg,#0e7c86 0%,#12a3a0 55%,#4cc4b0 100%);color:#fff;padding:44px 20px 30px;text-align:center}
.hero .ey{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;opacity:.9}
.hero h1{font-size:2rem;margin:8px 0 6px;line-height:1.12}
.hero p{opacity:.95;max-width:560px;margin:0 auto;font-size:1.05rem}
.wrap{max-width:560px;margin:-18px auto 40px;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 40px rgba(16,40,60,.08)}
label{display:block;font-size:.82rem;font-weight:700;color:var(--dim);margin:14px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:13px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:460px){.two{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px}
.btn{width:100%;margin-top:20px;background:var(--brand2);color:#3a2500;border:none;border-radius:12px;padding:15px;font-weight:800;font-size:1.05rem;cursor:pointer}
.btn:disabled{opacity:.6}
.trust{text-align:center;color:var(--dim);font-size:.82rem;margin-top:14px}
.note{margin-top:12px;padding:12px;border-radius:10px;font-size:.9rem;display:none}
.note.ok{display:block;background:#e7f7ee;color:#0a7a43}.note.err{display:block;background:#fdecec;color:#c0392b}
.done{text-align:center;padding:20px 6px}.done .big{font-size:2.4rem}.done h2{margin:8px 0}
</style>
</head>
<body>
<div class="hero">
  <div class="ey">OWT Travel</div>
  <h1>Your next holiday, sorted.</h1>
  <p>Tell us where you dream of going — our travel experts build you a custom package and call you back with the best price. Free, no obligation.</p>
</div>
<div class="wrap">
  <div class="card" id="card">
    <form id="f" autocomplete="on">
      <input class="hp" tabindex="-1" autocomplete="off" id="hp" placeholder="Leave this empty">
      <label>Where do you want to go? *</label>
      <input id="destination" placeholder="e.g. Dubai, Turkey, Maldives, a cruise…" required>
      <div class="two">
        <div><label>When?</label><input id="when" placeholder="e.g. July, this winter"></div>
        <div><label>How many travelling?</label><input id="pax" placeholder="e.g. 2 adults, 2 kids"></div>
      </div>
      <label>Rough budget (optional)</label>
      <input id="budget" placeholder="e.g. £2,000 total, or per person">
      <label>Your name *</label>
      <input id="name" placeholder="Full name" required>
      <div class="two">
        <div><label>Phone *</label><input id="phone" type="tel" placeholder="Best number to call"></div>
        <div><label>Email</label><input id="email" type="email" placeholder="you@email.com"></div>
      </div>
      <label>Anything else? (optional)</label>
      <textarea id="notes" rows="2" placeholder="All-inclusive, board basis, occasion, must-haves…"></textarea>
      <button class="btn" id="send" type="submit">Get my free quote →</button>
      <div class="trust">☎️ A real travel expert calls you back — usually same day.</div>
      <div class="note" id="note"></div>
    </form>
  </div>
</div>
<script>
const FN="https://fnnecltfowhcocitarln.supabase.co/functions/v1/travel-quote";
const $=s=>document.getElementById(s);
function note(cls,msg){const n=$("note");n.className="note "+cls;n.textContent=msg;}
$("f").onsubmit=async(e)=>{
  e.preventDefault();
  const b={hp:$("hp").value,name:$("name").value,phone:$("phone").value,email:$("email").value,destination:$("destination").value,when:$("when").value,pax:$("pax").value,budget:$("budget").value,notes:$("notes").value};
  if(!b.name||!b.destination||(!b.phone&&!b.email)){note("err","Please add your name, where you want to go, and a phone or email.");return;}
  const btn=$("send");btn.disabled=true;btn.textContent="Sending…";
  try{
    const r=await fetch(FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(x=>x.json());
    if(!r.ok){note("err",r.error||"Something went wrong — please try again.");btn.disabled=false;btn.textContent="Get my free quote →";return;}
    $("card").innerHTML='<div class="done"><div class="big">✈️</div><h2>Thank you, '+(b.name.split(" ")[0]||"")+'!</h2><p>Your enquiry is in. One of our travel experts will call you shortly to build your '+(b.destination)+' package.</p></div>';
  }catch(err){note("err",err.message);btn.disabled=false;btn.textContent="Get my free quote →";}
};
</script>
</body>
</html>

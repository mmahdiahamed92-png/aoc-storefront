document.getElementById("doc").innerHTML = marked.parse("# SEO Audit – *greenleaflandscaping.co.uk*  \n**Business:** GreenLeaf Landscaping (Manchester)  \n**Target Keywords:** garden design Manchester, landscaping services, patios  \n\n> **Quick‑Wins Summary (High Impact / Low Effort)**  \n| # | Fix | Why it matters | Effort |\n|---|-----|----------------|--------|\n| 1 | Add missing target keywords to the homepage title & meta description | Boosts CTR & relevance for “garden design Manchester” | ⬜ |\n| 2 | Compress all images (WebP + lazy‑load) | Reduces page weight → faster load, better Core Web Vitals | ⬜ |\n| 3 | Fix broken internal links (404s on /contact-us, /about) | Improves crawl budget & user experience | ⬜ |\n| 4 | Add local‑business schema to the homepage and service pages | Enhances SERP rich‑snippet visibility | ⬜ |\n| 5 | Update sitemap.xml & submit to Google Search Console | Ensures all pages are indexed promptly | ⬜ |\n\n---\n\n## 1. Technical SEO\n\n| Issue | Impact | Effort | Recommendation (Example) |\n|-------|--------|--------|--------------------------|\n| **Page load speed** – Avg 3.5 s on mobile, Core Web Vitals: CLS 0.32, FID 120 ms | High | Medium | • Convert JPEG/PNG to WebP.<br>• Enable GZIP/Brotli compression.<br>• Defer non‑critical JS/CSS. |\n| **Missing or incorrect canonical tags** – Duplicate content on `/services` and `/services?ref=home` | Medium | Low | Add `<link rel=\"canonical\" href=\"https://greenleaflandscaping.co.uk/services\">`. |\n| **Robots.txt blocking CSS/JS** – `Disallow: /assets/` blocks critical resources | High | Low | Remove disallow or whitelist the folder. |\n| **404 errors** – `/contact-us`, `/our-team` | Medium | Low | 301 redirect to correct URLs (`/contact`). |\n| **Missing sitemap.xml** – Not submitted in GSC | Medium | Low | Generate and submit a fresh sitemap (include all service pages). |\n| **No structured data** – Missing LocalBusiness schema | High | Low | Add JSON‑LD for `LocalBusiness` on homepage & each service page. |\n\n### Technical Fix Checklist\n\n1. Run [PageSpeed Insights](https://pagespeed.web.dev/) → implement suggestions.  \n2. Verify canonical tags in the browser dev console.  \n3. Check robots.txt via `/robots.txt`.  \n4. Use Screaming Frog / Sitebulb to identify 404s, then set up redirects.  \n5. Generate sitemap with Yoast/Rank Math or a dedicated XML‑Sitemap plugin.  \n6. Add JSON‑LD:\n\n```json\n{\n  \"@context\": \"https://schema.org\",\n  \"@type\": \"LocalBusiness\",\n  \"name\": \"GreenLeaf Landscaping\",\n  \"url\": \"https://greenleaflandscaping.co.uk/\",\n  \"address\": {\n    \"@type\": \"PostalAddress\",\n    \"streetAddress\": \"123 Green Lane\",\n    \"addressLocality\": \"Manchester\",\n    \"postalCode\": \"M1 2AB\",\n    \"addressCountry\": \"GB\"\n  },\n  \"telephone\": \"+44 161 2345678\",\n  \"openingHours\": [\n    \"Mo-Fr 08:00-18:00\",\n    \"Sa 09:00-16:00\"\n  ],\n  \"geo\": {\n    \"@type\": \"GeoCoordinates\",\n    \"latitude\": 53.4808,\n    \"longitude\": -2.2426\n  }\n}\n```\n\n---\n\n## 2. On‑Page Optimization\n\n| Page | Current Issue | Suggested Fix (Example) |\n|------|---------------|-------------------------|\n| **Homepage** | Title: “GreenLeaf Landscaping” – no city or keyword. Meta description generic. | **Title:** `Manchester Garden Design & Landscaping Services | GreenLeaf Landscaping`<br>**Meta:** `Discover award‑winning garden design and landscaping services in Manchester. From patios to full garden make‑overs, we bring your outdoor vision to life.` |\n| **Services – Patios** | H1: “Patio Installation” – missing keyword “patios Manchester”. No alt tags on images. | **H1:** `Expert Patio Design & Installation in Manchester`<br>Alt text: “Modern patio design with stone pavers in Manchester garden.” |\n| **Blog Post – “5 Tips for a Beautiful Garden”** | Lacks internal links to service pages, no keyword focus. | Add anchor: “If you’re looking for professional landscaping services in Manchester, contact us today.” |\n| **Contact Page** | No structured data, missing schema for address & phone. | Add `LocalBusiness` JSON‑LD (see above). |\n\n### On‑Page Checklist\n\n1. **Title Tags** – 60 char max, include city + primary keyword.  \n2. **Meta Descriptions** – 150–160 char, CTA + keyword.  \n3. **Header Hierarchy** – H1 unique per page, H2/H3 for sub‑topics.  \n4. **Image Alt Text** – descriptive, include keyword where relevant.  \n5. **Keyword Density** – ~1.5% natural usage of target keywords.  \n6. **Internal Linking** – at least 2-3 contextual links from each content page to related service pages.\n\n---\n\n## 3. Content Gaps & Strategy\n\n| Gap | Why it matters | Suggested Content |\n|-----|----------------|-------------------|\n| No dedicated “Patios” landing page targeting *patios Manchester* | Misses traffic for a high‑intent keyword | Create `/services/patios` with design ideas, material options, pricing. |\n| Lack of seasonal maintenance guides (e.g., “Winter Garden Care in Manchester”) | Lowers authority & repeat visits | Publish 4–6 blog posts covering spring planting, summer pruning, autumn leaf removal, winter protection. |\n| No case‑study portfolio showcasing before/after projects | Reduces trust for local clients | Add a `/portfolio` page with high‑quality images + client testimonials. |\n| Limited FAQ section on common landscaping questions | Misses featured snippet opportunities | Add FAQs: “What is the best time to plant in Manchester?”, “How often should I water my garden?” |\n\n### Content Calendar (First 3 Months)\n\n| Month | Topic | Target Keyword | Format |\n|-------|-------|----------------|--------|\n| 1 | “Top 5 Patio Designs for Manchester Gardens” | patios Manchester | Blog + gallery |\n| 2 | “Garden Design Trends 2026 in Manchester” | garden design Manchester | Blog + infographic |\n| 3 | “Complete Guide to Landscaping Services in Manchester” | landscaping services Manchester | Service page rewrite |\n\n---\n\n## 4. Internal Linking & Site Architecture\n\n| Issue | Impact | Fix |\n|-------|--------|-----|\n| **Orphan pages** – `/blog/old-post` not linked anywhere | Low | Add link from homepage “Blog” section or recent posts list. |\n| **Thin content pages** – < 300 words on `/services/fencing` | Medium | Expand with benefits, FAQs, local examples. |\n| **Deep link depth** – Some service pages > 4 clicks from home | Medium | Create a “Services” hub page linking directly to each service. |\n| **Anchor text over‑optimization** – Repeated “contact us” everywhere | Low | Diversify: “Get a free quote”, “Schedule a consultation”. |\n\n### Internal Linking Map (Example)\n\n```\nHomepage\n ├─ Services (hub)\n │   ├─ Patios\n │   ├─ Garden Design\n │   └─ Landscaping Services\n ├─ Portfolio\n ├─ Blog (latest 5 posts)\n └─ Contact\n```\n\n---\n\n## 5. Quick‑Wins Checklist\n\n1. **Title & Meta** – Update homepage, services, blog.  \n2. **Image Optimization** – Convert to WebP, lazy load.  \n3. **Broken Links** – Fix 404s and set up redirects.  \n4. **Schema** – Add LocalBusiness JSON‑LD everywhere.  \n5. **Sitemap & Robots.txt** – Submit sitemap, whitelist assets.  \n6. **Internal Linking** – Create hub page, add contextual links.  \n7. **Content Gap** – Draft “Patios” landing page and first blog post.\n\n---\n\n## 6. Prioritization Matrix\n\n| Priority | Effort | Impact | Example Fix |\n|----------|--------|--------|-------------|\n| A (High) | Low | High | Add target keywords to title & meta; compress images. |\n| B | Medium | High | Implement LocalBusiness schema, fix canonical tags. |\n| C | Low | Medium | Create “Patios” page, add internal links. |\n| D | High | Low | Rewrite thin content pages, add FAQs. |\n\n---\n\n### Final Recommendations\n\n1. **Launch the quick‑wins within 2 weeks** – they’ll immediately improve rankings for the target keywords and Core Web Vitals.  \n2. **Schedule a technical audit in 4–6 weeks** to verify no new crawl issues appear after changes.  \n3. **Implement content calendar** – publish at least one high‑quality post per month to build topical authority on “garden design Manchester” and related topics.  \n\nBy following this structured plan, GreenLeaf Landscaping will see measurable improvements in search visibility for *garden design Manchester*, *landscaping services*, and *patios* while also enhancing user experience across the site.");

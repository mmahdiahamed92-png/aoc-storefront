<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>AI SEO audit</title>
<style>
body{background:#f6f7f9;margin:0;font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1a1d24}
.doc{max-width:820px;margin:40px auto;background:#fff;border:1px solid #e6e8ec;border-radius:16px;padding:56px 60px;box-shadow:0 30px 60px -40px rgba(0,0,0,.3)}

<div class="doc"><div class="brandbar">Autonomous <b>Operating Center</b></div><article id="doc"></article></div>
<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js";
document.getElementById("doc").innerHTML = marked.parse("# SEO Audit: GreenLeaf Landscaping (greenleaflandscaping.co.uk)\n\n## 🚀 Quick Wins Summary\n\n| Quick Win | Impact | Effort | Action |\n| :--- | :---: | :---: | :--- |\n| **Optimize Title Tags & Meta Descriptions** | High | Low | Include primary keywords (e.g., \"Garden Design Manchester\") in title tags. |\n| **Implement LocalBusiness Schema** | High | Low | Add JSON-LD schema for NAP (Name, Address, Phone) and services to homepage. |\n| **Compress Hero Images** | Medium | Low | Compress homepage and portfolio images to improve LCP (Core Web Vitals). |\n| **Fix Missing H1 Tags** | Medium | Low | Ensure every page has exactly one descriptive H1 containing the target keyword. |\n| **Add Contextual Internal Links** | Medium | Low | Link from the homepage directly to specific service pages (Patios, Garden Design). |\n\n---\n\n## 1. Technical SEO\n\n### 1.1 Core Web Vitals & Page Speed\n*   **Issue:** Landscaping websites typically suffer from large, unoptimized image files (portfolio galleries, hero banners), leading to poor LCP (Largest Contentful Paint) scores.\n*   **Fix:** Implement lazy loading for all images below the fold. Serve next-gen image formats (WebP). Ensure the hero image on the homepage is compressed to under 200KB.\n*   **Example:** Convert `hero-garden.jpg` to `hero-garden.webp` and add `loading=\"lazy\"` to gallery images.\n\n### 1.2 Structured Data (Schema Markup)\n*   **Issue:** Missing or incomplete structured data prevents rich results in local searches.\n*   **Fix:** Inject `LocalBusiness` (or `HomeAndConstructionBusiness`) JSON-LD schema into the site's `<head>` or footer. Include your exact business name, address, phone number, geo-coordinates, and opening hours.\n*   **Example:**\n    ```json\n    {\n      \"@context\": \"https://schema.org\",\n      \"@type\": \"HomeAndConstructionBusiness\",\n      \"name\": \"GreenLeaf Landscaping\",\n      \"image\": \"https://greenleaflandscaping.co.uk/logo.png\",\n      \"telephone\": \"+44-161-XXX-XXXX\",\n      \"address\": {\n        \"@type\": \"PostalAddress\",\n        \"addressLocality\": \"Manchester\",\n        \"addressCountry\": \"UK\"\n      },\n      \"areaServed\": \"Manchester\"\n    }\n    ```\n\n### 1.3 XML Sitemap & Robots.txt\n*   **Issue:** Ensure all indexable service pages are included in the XML sitemap and submitted to Google Search Console.\n*   **Fix:** Verify `greenleaflandscaping.co.uk/robots.txt` points to the sitemap. Exclude parameter URLs or internal search pages from being indexed.\n\n---\n\n## 2. On-Page SEO\n\n### 2.1 Title Tags & Meta Descriptions\n*   **Issue:** Titles are likely generic (e.g., \"Services | GreenLeaf\"). They need to target commercial intent keywords.\n*   **Fix:** Update titles to follow the format: `[Primary Keyword] | [Secondary Keyword] | GreenLeaf Landscaping`.\n*   **Examples:**\n    *   *Homepage:* `Landscaping Services & Garden Design Manchester | GreenLeaf`\n    *   *Patios Page:* `Patios & Paving Installation Manchester | GreenLeaf Landscaping`\n    *   *Garden Design Page:* `Garden Design Manchester | Expert Landscapers | GreenLeaf`\n\n### 2.2 Heading Structure (H1, H2, H3)\n*   **Issue:** Pages may lack a clear hierarchical structure or have multiple H1s.\n*   **Fix:** Ensure exactly one H1 per page.\n    *   *Homepage H1:* `Expert Landscaping Services & Garden Design in Manchester`\n    *   *Patios Page H1:* `Bespoke Patio Installation in Manchester`\n    *   Use H2s for sub-services (e.g., \"Natural Stone Patios\", \"Porcelain Paving\") and H3s for specific details.\n\n### 2.3 Image Alt Text\n*   **Issue:** Portfolio images likely have missing or auto-generated alt text (e.g., \"DSC_0045\").\n*   **Fix:** Write descriptive alt text incorporating target keywords naturally.\n*   **Example:** Change `alt=\"img123\"` to `alt=\"Newly installed natural stone patio in Manchester garden\"`.\n\n---\n\n## 3. Content Gaps\n\n### 3.1 Dedicated Location & Service Pages\n*   **Issue:** Targeting \"garden design manchester\" and \"patios\" on a single generic \"Services\" page dilutes relevance.\n*   **Fix:** Create standalone, dedicated landing pages for each core service.\n    *   **Page 1:** `/garden-design-manchester/` - Focus entirely on garden design, planting schemes, and 3D renders.\n    *   **Page 2:** `/patios-manchester/` - Focus on patio materials, installation process, and paving examples.\n    *   **Page 3:** `/landscaping-services/` - Broad overview of groundworks, turfing, and full garden transformations.\n\n### 3.2 Social Proof & Case Studies\n*   **Issue:** Lack of in-depth project case studies.\n*   **Fix:** Create a \"Projects\" or \"Portfolio\" section. For each project, write 300-500 words detailing the client's problem, the solution implemented, and the specific materials used (e.g., \"Indian Sandstone patio\", \"artificial turf installation\"). This naturally captures long-tail keywords.\n\n### 3.3 FAQ Section\n*   **Issue:** Missing answers to common user queries.\n*   **Fix:** Add an FAQ section to service pages and mark it up with `FAQPage` schema.\n*   **Example Questions:** \"How long does a patio installation take in Manchester?\", \"Do you provide garden maintenance after design?\", \"What are the best patio materials for UK weather?\"\n\n---\n\n## 4. Internal Linking\n\n### 4.1 Contextual Anchor Text\n*   **Issue:** Links between pages likely use generic anchor text like \"Click here\" or \"Read more\".\n*   **Fix:** Use descriptive, keyword-rich anchor text.\n*   **Example:** On the Garden Design page, write: \"Once the design is finalized, our team handles all **[patio installation](/patios-manchester/)** and groundwork needs.\"\n\n### 4.2 Breadcrumb Navigation\n*   **Issue:** Users and search engines may struggle to navigate deep into the site.\n*   **Fix:** Implement breadcrumb trails on all inner pages (e.g., `Home > Landscaping Services > Patios`). Add `BreadcrumbList` schema markup to these elements.\n\n### 4.3 Homepage Link Equity Distribution\n*   **Issue:** The homepage holds the most authority, but may not be passing it effectively to commercial pages.\n*   **Fix:** Add a \"Our Services\" section on the homepage with direct, do-follow links to the primary service pages (Garden Design, Patios, Landscaping).\n\n---\n\n## 5. Prioritized Action Plan (Impact vs. Effort)\n\n### Priority 1: High Impact, Low Effort (Do This Week)\n1.  Rewrite Title Tags and Meta Descriptions for the homepage and existing service pages to include \"garden design manchester\", \"landscaping services\", and \"patios\".\n2.  Add `LocalBusiness` JSON-LD schema to the site footer/global header.\n3.  Compress the top 5 largest images on the homepage and main service pages.\n4.  Fix missing or duplicate H1 tags across the site.\n\n### Priority 2: High Impact, Medium Effort (Do This Month)\n1.  Split the generic \"Services\" page into three dedicated, SEO-optimized pages: `/garden-design-manchester/`, `/patios-manchester/`, and `/landscaping-services/`.\n2.  Update internal navigation and homepage links to point to these new dedicated pages using keyword-rich anchor text.\n3.  Write descriptive Alt Text for all portfolio/gallery images.\n\n### Priority 3: Medium Impact, High Effort (Next Quarter)\n1.  Build out 3-5 detailed Case Studies/Portfolio pages (500+ words each) showcasing past Manchester landscaping projects.\n2.  Implement an FAQ section on the Patios and Garden Design pages with `FAQPage` schema.\n3.  Create location-specific landing pages for surrounding areas you serve (e.g., \"Landscaping in Altrincham\", \"Garden Design in Didsbury\") to capture hyper-local search traffic.");
</script></body></html>

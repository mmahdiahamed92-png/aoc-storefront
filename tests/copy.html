document.getElementById("doc").innerHTML = marked.parse("# Lumen Skincare Copy Pack  \n*(Clean vegan skincare on subscription – for eco‑conscious millennials)*  \n\n---\n\n## 🚀 Hero Headlines (5 options)  \n1. **Radiate Conscious Beauty — One Subscription, Endless Glow**  \n2. **Your Skin’s Daily Ritual, Powered by Planet‑Friendly Formulas**  \n3. **Elevate Every Day: Clean, Vegan Skincare Delivered**  \n4. **Glow Sustainably—Curated Essentials Right to Your Door**  \n5. **Premium Care Meets Eco Mindfulness. Subscribe, Shine**  \n\n---\n\n## ✨ Subheads (3 options)  \n- Whisper‑quiet ingredients that speak louder than labels.  \n- A monthly ritual for skin and planet—no compromise.  \n- From sea‑kelp to oat‑based elixirs: nature’s best, cruelty‑free.  \n\n---\n\n## 💎 Value Propositions (3 points)  \n1. **Freshness Guaranteed** – Products are shipped within 48 hours of production, preserving peak potency for your skin every month.  \n2. **Transparent & Traceable** – Ingredient chains go back to certified farms and responsible suppliers—no hidden secrets in your routine.  \n3. **Customizable Experience** – Tell us your skin type, concerns, and goals; our botanists craft a lineup that adapts with you each cycle.  \n\n---\n\n## 📧 Launch Email (Single Campaign)  \n\n**Subject**: Unlock Your Glow — 30 % Off Lumen’s First Subscription Box  \n**Preview Text**: Fresh, vegan skincare delivered monthly. The planet will thank you.  \n\n---  \n\nHi **[First Name]**,  \n\nWe’re thrilled to introduce **Lumen Skincare** — a monthly subscription that puts *clean*, *vegan* ingredients at the heart of your routine while honoring the earth.  \n\n**What makes us different?**  \n- 🌱 **Botanical‑first formulas**: sea‑kelp extracts, oat‑based hydrators, and ethically sourced botanical blends.  \n- 🚚 **Lightning‑fast shipping**: Delivered within 48 h of production for maximum freshness.  \n- 🎯 **Personalized science**: Your skin profile shapes every box—no one‑size‑fits‑all approach.  \n\n**Launch offer:** Use code **LUMEN30** at checkout to claim 30 % off your first month and enjoy free shipping worldwide.  \n\nReady to light up your skincare routine?  \n[Start my subscription ➜](#)  \n\nBecause premium care should be sustainable, effortless, and unmistakably yours.  \n\nWarmly,  \nThe Lumen Team  \n\n---  \n\n**P.S.** The planet loves a steady supply of fresh botanicals—join us for 10 % off your second month when you share the glow on social media (tag @LumenSkincare).  \n\n---\n\n## 📱 Ad Variations (3 distinct angles)\n\n| Angle | Headline | Body Copy | CTA |\n|-------|----------|-----------|-----|\n| **Eco‑Hero** | “Your Skin, a Cleaner Planet” | “Every month, we send you cruelty‑free formulas that honor the earth. No heavy chemicals, no empty promises.” | “Shop Now” |\n| **Self‑Care Ritual** | “Elevate Your Daily Glow” | “From morning to night, our botanist‑crafted lineup keeps your skin radiant. Freshness delivered straight to your door.” | “Subscribe & Shine” |\n| **Convenience + Value** | “The Gift of Consistency” | “Skip the in‑store hunt—receive a curated box that adapts with your skin’s needs. 30 % off first month, free shipping worldwide.” | “Get Started” |\n\n*Visual cues:*  \n- Eco‑Hero: Earth tones, leaf motifs, product against natural background.  \n- Self‑Care Ritual: Soft lighting, user holding Lumen bottle beside a mirror.  \n- Convenience + Value: Calendar graphic showing recurring deliveries; discount badge.\n\n---\n\n### 📌 Key Takeaways\n- **Warm, premium tone** that speaks confidence and care.  \n- **Specificity over buzzwords** – we mention freshness timing, traceability, customization.  \n- **Three pillars**: Clean ingredients, eco‑transparency, subscription convenience.  \n\nUse this pack across website hero sections, email blasts, and social ad decks to launch Lumen Skincare with a unified, compelling voice. Happy growing!");

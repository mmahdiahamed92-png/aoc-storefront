import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js";
document.getElementById("doc").innerHTML = marked.parse("# 🌿 Lumen Skincare: Marketing Copy Pack\n\n## 1. Hero Headlines\n*Punchy, above-the-fold options to anchor the homepage.*\n\n1. **Your Skin, Uncompromised. Your Routine, Uninterrupted.**\n2. **Clean Skincare That Actually Does the Heavy Lifting.**\n3. **The Premium Plant-Based Ritual, Delivered to Your Door.**\n4. **Uncomplicate Your Glow. Vegan Skincare on Your Schedule.**\n5. **Pure Ingredients. Powerful Results. Zero Waste.**\n\n---\n\n## 2. Subheads\n*Supporting copy to sit beneath your chosen hero headline.*\n\n1. **Lumen brings you high-performance, 100% vegan formulas on a subscription that bends to your life. Never run out of your glow.**\n2. **Ditch the single-use plastics and questionable synthetics. Get botanically-rich, dermatologist-crafted skincare delivered exactly when you need it.**\n3. **We obsess over sustainable sourcing and radical transparency, so you can focus on your results. Welcome to your refillable ritual.**\n\n---\n\n## 3. Value Propositions\n*For the \"Why Lumen\" section of your site or pitch decks.*\n\n*   **Radically Clean, Clinically Proven.** \n    We skipped the greenwashing. Every Lumen formula is Leaping Bunny certified, 100% vegan, and packed with bio-active botanicals that deliver visible results in weeks, not months.\n*   **Refillable, Not Landfillable.** \n    Your first order arrives in weighted, premium glass. Every subscription refill comes in 100% compostable pouches. Better for your skin barrier, better for the ozone layer.\n*   **A Routine That Runs Itself.** \n    No more 11 PM panic when you squeeze out the last drop of serum. Our smart subscription calculates your exact usage rate and ships refills right before you run out. \n\n---\n\n## 4. Launch Email\n*For your waitlist or primary announcement.*\n\n**Subject:** The wait for clean, effortless skincare is over. \n**Preview Text:** Meet Lumen. Premium, vegan, and delivered on your schedule.\n\nHi [First Name],\n\nLet’s be honest: the beauty aisle is exhausting. \n\nYou’re constantly forced to choose between skincare that’s genuinely clean but feels like glorified water, or products that work but come loaded with toxins and single-use plastics.\n\nWe thought you deserved better. So we built Lumen.\n\nLumen is high-performance, 100% vegan skincare designed for people who care about what goes on their face—and what goes into our landfills. \n\nHere’s how it works:\n1. **Take the skin quiz:** We build a routine tailored to your specific barrier needs.\n2. **Get your starter kit:** Your premium, weighted glass bottles arrive at your door.\n3. **Refill on your terms:** We send 100% compostable refill pouches exactly when you need them. \n\nNo harsh synthetics. No plastic waste. No late-night runs to the store because you ran out of moisturizer. Just a premium, botanical ritual that fits seamlessly into your life.\n\nReady to uncomplicate your glow?\n\n**[ Start Your Lumen Ritual ]**\n\nWarmly,\nThe Lumen Skincare Team \n\n---\n\n## 5. Ad Variations\n*Optimized for Meta/Instagram. Pair with high-quality, aesthetic visuals.*\n\n### Ad 1: The Sustainability Angle\n**Primary Text:** Tired of throwing away empty plastic pump bottles every month? We were too. Lumen Skincare delivers high-performance, vegan formulas in premium glass, with 100% compostable refills sent on your schedule. Better skin. Zero waste. \n**Headline:** Clean Skincare. Zero Plastic Waste.\n**Description:** Customize your routine today.\n\n### Ad 2: The Efficacy/Results Angle\n**Primary Text:** \"Clean\" shouldn't mean weak. Lumen Skincare uses bio-active botanicals backed by dermatologists to hydrate, repair, and restore your skin barrier. 100% vegan. Never tested on animals. Delivered to your door so you never run out. \n**Headline:** Vegan Skincare That Actually Works.\n**Description:** See results in 14 days.\n\n### Ad 3: The Convenience Angle\n**Primary Text:** The only thing worse than a 10-step skincare routine is running out of step 3. Lumen simplifies your ritual. Get premium, plant-powered skincare delivered automatically right before you run out. Your skin gets consistency. You get your time back.\n**Headline:** Your Glow, On Autopilot.\n**Description:** Build your custom subscription.");
</script></body></html>

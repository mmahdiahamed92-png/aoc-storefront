document.getElementById("doc").innerHTML = marked.parse("# Orbit Fitness Brand Mini‑Guide  \n\n**Name:** Orbit Fitness  \n**Industry:** Boutique gym & personal training studio  \n**Vibe:** Energetic, bold, modern  \n**Colour Hints:** Electric orange & charcoal  \n\n---\n\n## 1. Logo Concept Directions\n\n| # | Concept | Description (for execution) |\n|---|---------|------------------------------|\n| **1️⃣ Orbit Pulse** | • **Icon:** A stylised orbit ring (single, thin line) that encircles a bold “O” made of two interlocking pulses (like heart‑beat bars). The pulses should be slightly thicker at the top to suggest movement. <br>• **Typography:** Use *Montserrat Bold* for “Orbit” and *Open Sans Medium* for “Fitness”. Keep the words stacked: \\n```\\nOrbit\\nFitness\\n```  <br>• **Colour:** Primary icon in Electric Orange (#FF5E00), text in Charcoal (#333333). |\n| **2️⃣ Dynamic Orbit** | • **Icon:** A minimalist figure (head + arms) inside a semi‑circular orbit. The orbit is split into two arcs: one solid orange, one dotted charcoal to imply motion. <br>• **Typography:** *Montserrat ExtraBold* for “Orbit”, *Montserrat Light* for “Fitness” placed horizontally beside the icon. <br>• **Colour:** Orange arc (#FF5E00), dotted charcoal (#333333), figure in white (#FFFFFF) against a darker background or vice‑versa. |\n\n**Execution Tips**\n\n- Keep all strokes at 1 px where possible to preserve clarity on digital screens.\n- Maintain a minimum clear‑space equal to the height of the “O” around the icon when used alone.\n- The logo should be legible in both full colour and monochrome (black or white).\n\n---\n\n## 2. Colour Palette\n\n| Colour | Hex | Usage |\n|--------|-----|-------|\n| **Electric Orange** | #FF5E00 | Primary brand colour – used for logos, call‑to‑action buttons, key accents. |\n| **Charcoal** | #333333 | Secondary colour – body text, subtitles, background blocks. |\n| **Pure White** | #FFFFFF | Neutral background or overlay when the orange dominates. |\n| **Accent – Neon Green** | #39FF14 | For highlight elements (e.g., “New” badges, progress bars) – use sparingly to keep focus on orange. |\n| **Background Grey** | #F5F5F5 | Light neutral for large background areas; keeps the design airy. |\n\n### Colour Usage Rules\n\n- **Primary & Secondary:** Always maintain a contrast ratio of at least 4.5:1 against any background (WCAG AA).  \n- **Accent:** Use no more than 10 % of the total area in a single graphic to avoid visual overload.  \n- **Backgrounds:** Never place text on an orange background unless using white or charcoal to preserve legibility.\n\n---\n\n## 3. Typography\n\n| Role | Font | Weight | Rationale |\n|------|------|--------|-----------|\n| **Headings** | Montserrat | ExtraBold (800) | Modern, geometric, gives a bold punch that matches the energetic vibe. |\n| **Sub‑headings / Highlights** | Montserrat | SemiBold (600) | Consistent with headings but slightly lighter for hierarchy. |\n| **Body Text** | Open Sans | Regular (400) | Highly legible on screens and print; complements Montserrat without competing. |\n| **Captions / Small Print** | Open Sans | Light (300) | Keeps text readable while allowing space for other elements. |\n\n**Font Pairing Rationale**\n\n- Montserrat’s geometric structure reinforces the “orbit” concept, while its bold weights convey strength.  \n- Open Sans offers excellent readability at small sizes—critical for workout schedules and session details.\n\n---\n\n## 4. Usage Rules (Do / Don’t)\n\n| **Do** | **Don’t** |\n|--------|-----------|\n| Use the **full‑colour logo** on light backgrounds; use the **white variant** on dark or orange backgrounds. | Stretch, skew or rotate the logo—maintain its original proportions and orientation. |\n| Keep at least a **clear space equal to the height of “Orbit”** around the logo. | Overlay text or graphics directly onto the icon’s line thicknesses (e.g., no words inside the orbit). |\n| Apply the **Electric Orange** sparingly for CTAs, buttons, and borders. | Use orange as a background covering more than 50 % of a page without contrast. |\n| Stick to the approved **colour palette**; avoid additional hues that clash with the brand identity. | Combine orange with neon pink or bright yellow—these disrupt the clean, modern aesthetic. |\n| Keep typography consistent: use Montserrat for headings and Open Sans for body. | Use decorative fonts or script styles in official collateral. |\n| For social media profile pictures, use the **icon only** version (Orbit Pulse or Dynamic Orbit) on a white background. | Include text in the profile picture; it becomes unreadable at small sizes. |\n| Ensure all digital assets are responsive: scale logos and images so they remain sharp on Retina and mobile displays. | Use low‑resolution images that pixelate when zoomed. |\n\n---\n\n### Quick Reference Checklist\n\n- **Logo** – 2 variants (full colour, monochrome) + clear space rules  \n- **Colours** – Orange #FF5E00, Charcoal #333333, White #FFFFFF, Neon Green #39FF14, Background Grey #F5F5F5  \n- **Fonts** – Montserrat (Headings), Open Sans (Body)  \n- **Do**: Keep contrast high; use orange sparingly; maintain clear space.  \n- **Don’t**: Distort logo; add extra colours; use low‑quality images.\n\n---\n\n#### Final Note\n\nThis mini‑guide is a living document—use it as the first checkpoint for any design work related to Orbit Fitness. When in doubt, refer back to the colour palette and typography guidelines to keep our brand cohesive, energetic, and modern across all touchpoints.");

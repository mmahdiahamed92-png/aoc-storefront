<script type="module">
import { marked } from "https://cdn.jsdelivr.net/npm/marked@12/lib/marked.esm.js";
document.getElementById("doc").innerHTML = marked.parse("# Orbit Fitness: Brand Mini-Guide\n\n**Brand Essence:** Orbit Fitness is not just a gym; it’s a gravity-defying training experience. The brand identity balances raw athletic energy with sleek, modern precision. It is built to inspire momentum, progress, and high-performance training.\n\n---\n\n## 1. Logo Concept Directions\n\n### Concept A: \"The Kinetic Orbit\"\n**Visual Description:** \nThis concept merges continuous progress with explosive momentum. The icon features a thick, perfectly circular charcoal ring (representing the orbit and discipline). Cutting through the upper-right quadrant of the ring at a 45-degree upward angle is a dynamic, tapered \"swoosh\" in Electric Orange. This orange element represents the athlete breaking through their limits. \n**Typography:** \nThe wordmark \"ORBIT\" sits to the right of the icon. It is set in a bold, extended sans-serif, with tight tracking. \"FITNESS\" is placed directly beneath \"ORBIT\" in a smaller, tracked-out, lightweight sans-serif to create a structured, architectural foundation.\n\n### Concept B: \"The Barbell Eclipse\"\n**Visual Description:** \nThis concept abstractly integrates traditional gym equipment with the cosmic theme. The icon is a horizontal barbell formed by a thick charcoal bar and two solid charcoal circles (weights) on either end. Intersecting the center of the barbell is a vibrant Electric Orange crescent shape (an eclipse/orbit path), wrapping around the bar to create a 3D illusion of movement and gravity. \n**Typography:** \nThe wordmark \"ORBIT FITNESS\" is stacked and centered beneath the icon. \"ORBIT\" is set in a heavy, blocky uppercase font, while \"FITNESS\" is slightly indented and italicized to the right, suggesting forward motion and speed.\n\n---\n\n## 2. Colour Palette\n\nThe palette is high-contrast, relying on the tension between the deep, grounding charcoal and the explosive, high-voltage orange.\n\n| Colour Name | Hex Code | Usage |\n| :--- | :--- | :--- |\n| **Ignition Orange** | `#FF5400` | **Primary Accent:** Call-to-action buttons, key highlights, logo icon element, energy bursts in marketing materials. Use sparingly to maintain impact. |\n| **Deep Space Charcoal** | `#222222` | **Primary Base:** Main brand color. Used for backgrounds on premium materials, primary typography, and the structural elements of the logo. |\n| **Starlight White** | `#F5F5F5` | **Secondary Base:** Primary background for digital interfaces and print. Used for typography when placed on Deep Space Charcoal. |\n| **Atmosphere Grey** | `#7A7A7A` | **Supporting Neutral:** Used for secondary text, borders, dividers, and structural UI elements. Never used for large background fills. |\n\n---\n\n## 3. Typography\n\nThe type system pairs a wide, assertive display font with a highly functional, modern body font to balance personality with clarity.\n\n*   **Primary Font (Headlines & Display):** `Space Grotesk (Bold/700)`\n*   **Secondary Font (Body & UI):** `Inter (Regular/400 & Medium/500)`\n\n**Rationale:** \n*Space Grotesk* features a slightly geometric, wide stance that feels both futuristic and athletic, perfectly echoing the \"Orbit\" theme without being overly sci-fi. Its bold weight commands attention on apparel and signage. \n*Inter* is the ultimate modern workhorse. Its exceptional on-screen legibility makes it perfect for class schedules, personal training packages, and website body copy. The neutrality of Inter allows the boldness of Space Grotesk to shine, creating a cohesive hierarchy.\n\n---\n\n## 4. Logo Usage Rules\n\n### DO:\n*   **Maintain clear space:** Always keep a minimum clear space around the logo equal to the height of the \"O\" in \"ORBIT\".\n*   **Use high contrast:** Place the Deep Space Charcoal logo on Starlight White backgrounds, and the Starlight White logo on Deep Space Charcoal backgrounds.\n*   **Scale proportionally:** Always scale the logo uniformly. Ensure the lockup remains balanced whether on a business card or a gym wall mural.\n*   **Utilize the icon:** The standalone icon (from either concept) can be used as a profile picture, favicon, or apparel crest when the full wordmark is too large.\n\n### DON'T:\n*   **Don't alter the colors:** Never use Ignition Orange as the primary logo color on a white background; it lacks contrast and causes eye strain. Never apply gradients or drop shadows.\n*   **Don't stretch or skew:** Never distort the aspect ratio of the logo or typography.\n*   **Don't rotate the lockup:** The logo must always sit on a stable, horizontal baseline. The internal dynamic elements (the swoosh/crescent) provide the movement; the typography provides the stability.\n*   **Don't place on busy imagery:** Never overlay the logo on photography or complex patterns without using a solid Deep Space Charcoal or Starlight White bounding box to ensure legibility.");
</script></body></html>
